name: build-image

# 一有提交就自动打包镜像，推到 GitHub Container Registry（GHCR）。
# 镜像名：ghcr.io/einsphoton/fakettcomposer
#   - push 到 main       → :latest 和 :main
#   - 打 tag v1.2.3      → :1.2.3、:1.2、:latest
#   - 任意提交           → :sha-xxxxxxx（方便回滚到某一版）
#   - Pull Request       → 只构建验证，不推送

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch: # 也可以在 Actions 页面手动点一下重新打包

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 取出代码
        uses: actions/checkout@v4

      # GHCR 要求镜像名全小写，仓库名里有大写字母所以要转一下
      - name: 计算镜像名
        id: image
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: 安装 QEMU（为了同时构建 ARM 版，群晖 ARM 机型也能用）
        uses: docker/setup-qemu-action@v3

      - name: 安装 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=TT作曲家 Web 版
            org.opencontainers.image.description=简谱编辑 / 自动伴奏 / 打印，NAS 上自建
            org.opencontainers.image.licenses=MIT

      - name: 构建并推送（linux/amd64 + linux/arm64）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # 第一次推送后 GHCR 里的包默认是私有的，这里尽力改成公开，
      # 这样 NAS 上 docker pull 不需要先登录。失败也不影响构建结果。
      - name: 尝试把镜像设为公开
        if: github.event_name != 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PKG: ${{ steps.image.outputs.name }}
        run: |
          pkg="${PKG#*/}"
          gh api --method PATCH "/user/packages/container/${pkg}" -f visibility=public \
            && echo "已设为公开：ghcr.io/${PKG}" \
            || echo "自动改可见性失败，请到 Packages 设置里手动改成 Public（只需一次）"

      - name: 构建结果
        run: |
          echo "### 镜像已就绪 🎉" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "NAS 上拉取：\`docker pull ghcr.io/${{ steps.image.outputs.name }}:latest\`" >> "$GITHUB_STEP_SUMMARY"
